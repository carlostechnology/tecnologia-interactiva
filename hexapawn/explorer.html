<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16489d">
<meta name="description" content="SmartChess Explorer: aprende Python con un tablero Hexapawn 3x3 y comprueba tus conocimientos con 60 preguntas.">
<title>SmartChess Explorer · TIC II · TORREX Learning Lab</title>
<style>
:root{--blue:#17428e;--blue2:#3263b2;--ink:#17366c;--muted:#6880a4;--line:#bbcbe3;--paper:#fff;--bg:#f4f7fc;--shadow:#20468112;--active:#e8f0fe;--good:#15846d;--bad:#b94c58;--grid:#deebf8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 "Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body.dark{--blue:#8db4ff;--blue2:#9abbf8;--ink:#d2e2ff;--muted:#96acce;--line:#405779;--paper:#14253e;--bg:#0d192c;--shadow:#0003;--active:#273e61;--good:#69dcb8;--bad:#ff9199;--grid:#223650}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d8a24a;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--blue2)}
button{border:1px solid var(--line);border-radius:3px;background:var(--paper);padding:9px 12px;font-weight:700;letter-spacing:.5px}
button:hover:not(:disabled){background:var(--active)}
button.primary{background:#16489d;color:white;border-color:#16489d}
button.primary:hover:not(:disabled){background:#0e367c}
button.ghost{background:transparent}.small{font-size:11px;color:var(--muted)}
.cap{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,p{margin-top:0}h2{font-size:17px;letter-spacing:1.6px;font-weight:850}h3{font-size:15px}
header{display:flex;align-items:center;gap:18px;min-height:77px;border-bottom:1px solid var(--line);padding:11px 22px;background:var(--paper)}
.brand{display:flex;align-items:center;gap:11px;min-width:260px}
.brand-icon{width:43px;height:43px;border:2px solid var(--blue);display:grid;place-items:center;font-size:28px;font-weight:bold;color:var(--blue)}
.brand strong{letter-spacing:2px;font-size:17px;white-space:nowrap}.brand small{display:block;font-size:9px;letter-spacing:1.4px;color:var(--muted)}
.top-info{padding-left:20px;border-left:1px solid var(--line);min-width:170px;flex:1}
.top-info strong{font-size:14px;letter-spacing:1px}.top-controls{display:flex;align-items:center;gap:6px}
.top-meter{display:flex;align-items:center;gap:7px;min-width:130px}.top-meter b{font-size:19px}
.meter{height:7px;background:var(--grid);border:1px solid var(--line);overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--blue2);transition:width .3s}
.tabs{display:flex;gap:3px;align-items:center}
.tabs button.active{background:#16489d;color:#fff;border-color:#16489d}
.workspace{padding:14px 18px 24px;display:grid;grid-template-columns:320px minmax(420px,1fr) 300px;grid-template-rows:minmax(550px,auto) auto;gap:12px;min-height:calc(100vh - 77px)}
.panel{background:var(--paper);border:1px solid var(--line);min-width:0;box-shadow:0 1px 4px var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:15px}
.panel-body{padding:16px;min-width:0}
.sidebar{grid-row:1 / span 2;overflow:hidden}
.nav-scroll{max-height:calc(100vh - 160px);overflow:auto;padding:9px 11px 18px}
.group-title{padding:14px 7px 6px;font-size:10px;letter-spacing:1.3px;font-weight:850;color:var(--muted)}
.lesson-btn{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 8px;border:0;border-bottom:1px solid var(--grid);border-radius:0;background:transparent;letter-spacing:0;font-weight:600}
.lesson-btn .number{background:var(--active);color:var(--blue);padding:3px 5px;font:700 11px monospace}
.lesson-btn .check{margin-left:auto;color:var(--good);font-weight:900}
.lesson-btn.active{background:var(--active);border-left:3px solid var(--blue2)}
.diagram{min-height:340px;position:relative;overflow:hidden;background-color:var(--paper);background-image:linear-gradient(30deg,transparent 49.7%,var(--grid) 50%,transparent 50.3%),linear-gradient(150deg,transparent 49.7%,var(--grid) 50%,transparent 50.3%);background-size:46px 27px}
.diagram svg{width:100%;height:350px;display:block}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--muted);padding:8px 15px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.toolbar{display:flex;gap:6px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.toolbar .spacer{flex:1}
.play-label{margin-right:6px;font:700 12px monospace}
.codebox{border-top:1px solid var(--line);background:var(--paper)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--grid)}
.code-lines{padding:9px 0;margin:0;overflow:auto;max-height:275px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
.code-line{display:flex;white-space:pre;min-width:max-content;padding:0 13px;min-height:20px}
.code-line.active{background:#f4e6c5;color:#473b20}
body.dark .code-line.active{background:#59472b;color:#fff}
.ln{display:inline-block;width:29px;color:var(--muted);user-select:none}
.inspector .panel-body{font-size:13px}
.inspector p{color:var(--muted);line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--grid);padding:8px 0;font-size:11px}
.kv b{max-width:65%;text-align:right}
.pill{display:inline-block;background:#d7f2e9;color:#0f765d;padding:4px 9px;font-size:10px;letter-spacing:1px;font-weight:800;border-radius:2px}
body.dark .pill{background:#1a4e4a;color:#8cefd0}
.note{background:var(--active);border-left:3px solid var(--blue2);padding:13px;margin-top:16px}
.note b{display:block;margin-bottom:5px}
.mini-board{margin:9px auto;max-width:220px;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line)}
.mini-board div{display:grid;place-items:center;font-size:24px}
.mini-board .a{background:#eef3fb;color:#254d8b}.mini-board .b{background:#c9dbf3;color:#254d8b}
.trace{grid-column:2 / 4;min-height:180px}
.trace table{width:100%;border-collapse:collapse;font:11px/1.5 ui-monospace,monospace}
.trace th,.trace td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid)}
.trace th{background:var(--active);color:var(--muted);font-size:10px;letter-spacing:1px}
.trace tr.current{background:#fff7dc;color:#3b3e4b}
body.dark .trace tr.current{background:#514527;color:#fff}
.question{padding:25px 22px 15px}
.question h1{font-size:23px;line-height:1.35;color:var(--ink);margin:9px 0 21px}
.option{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px;margin:10px 0;letter-spacing:0;font-weight:500}
.option span{min-width:24px;padding:2px 5px;font:800 12px monospace;background:var(--active)}
.option.selected{border-color:var(--blue);background:var(--active)}
.form-row{margin:12px 0}.form-row label{display:block;margin-bottom:5px;font-size:11px;font-weight:800;letter-spacing:.7px}
.form-row input,.form-row select{width:100%;padding:11px;border:1px solid var(--line);background:var(--paper);border-radius:3px}
.result-num{font-size:62px;line-height:1.2;font-weight:900;color:var(--blue)}
.result-num small{font-size:18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}
.stats>div{background:var(--active);padding:14px}.stats b{display:block;font-size:19px}
.stats span{font-size:10px;color:var(--muted)}
.feedback{padding:13px;border-left:4px solid var(--good);background:var(--active);margin:15px 0}
.feedback.bad{border-left-color:var(--bad)}
pre.output{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:var(--ink);background:var(--active);padding:12px;margin-top:11px;min-height:55px}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.tooltip{font-size:11px;color:var(--muted)}
@media(max-width:1200px){.workspace{grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto auto}.sidebar{grid-row:1 / span 2}.inspector{grid-column:2}.trace{grid-column:2}.top-info{display:none}}
@media(max-width:800px){header{flex-wrap:wrap;gap:11px;padding:12px}.brand{min-width:auto;flex:1}.workspace{display:block;padding:9px}.panel{margin-bottom:10px}.nav-scroll{max-height:230px}.sidebar{grid-row:auto}.diagram svg{height:280px}.top-meter{min-width:100px}.brand strong{font-size:14px}.panel-body{padding:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Activa JavaScript para utilizar SmartChess Explorer.</noscript>
<script>(function boot(LESSONS,BANK){
"use strict";
const mount=document.getElementById("app");
const LINK="https://tecnologiaingenieria.wordpress.com/2026/10/06/smartchess-hexapawn/";
const KEY="smartchess-explorer-20261103-v1";
const GROUPS=["LISTAS","BUCLES Y CONTADORES","FUNCIONES PEQUEÑAS","FUNCIONES CON LISTAS","REPRESENTAR EL TABLERO","CONTEO Y LÓGICA","CONSULTAR ANTES DE MOVER","REALIZAR UN AVANCE"];
const QS=BANK.flatMap((b,t)=>b.items.map((it,i)=>({id:t*10+i,topic:t,difficulty:Math.min(5,1+Math.floor(i/2)),text:it[0],options:it.slice(1,5),explanation:it[5]})));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const codeText=x=>esc(x).replace(/`([^`]+)`/g,"<code>$1</code>");
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const freshBoard=()=>[["N","N","N"],[".",".","."],["B","B","B"]];
let state={mode:"learn",lesson:0,step:0,completed:[],theme:"light",board:freshBoard(),turn:"B",selected:null,lastMove:"",exam:null};
try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.version===1){state={...state,...v};if(!Array.isArray(state.board))state.board=freshBoard();}}catch{}
let timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}));}catch{}}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function resetBoard(){state.board=freshBoard();state.turn="B";state.selected=null;state.lastMove="Tablero inicial";}
function currentLesson(){return LESSONS[state.lesson];}
function lines(){return currentLesson().code.split("\n");}
function progress(){return state.mode==="learn"?Math.round(state.completed.length/30*100):state.exam?(state.exam.done?100:Math.min(100,Math.round(state.exam.answers.length/(state.exam.mode==="practice"?60:45)*100))):0;}
function header(){const l=currentLesson(),isLearn=state.mode==="learn";return `<header><div class="brand"><div class="brand-icon">♟</div><div><strong>SMARTCHESS EXPLORER</strong><small>LEARN · CODE · EXPERIMENT</small></div></div><div class="top-info"><span class="cap">NOW ${isLearn?"LEARNING":"EVALUATING"}</span><br><strong>${isLearn?esc(l.title.toUpperCase()):"HEXAPAWN · PYTHON"}</strong><div class="small">${isLearn?"PRACTICE "+String(l.id).padStart(2,"0")+" / 30":"60 QUESTIONS · 6 TOPICS"} · TIC II</div></div><div class="top-meter"><span class="cap">PROGRESS</span><div class="meter"><i style="width:${progress()}%"></i></div><b>${progress()}%</b></div><div class="top-controls"><div class="tabs"><button class="${isLearn?"active":""}" data-action="switch-learn">APRENDER</button><button class="${!isLearn?"active":""}" data-action="switch-exam">EXAMEN</button></div><button class="ghost" data-action="theme" aria-label="Cambiar tema">${state.theme==="light"?"☾":"☀"}</button></div></header>`;}
function sidebar(){if(state.mode==="exam"){return `<aside class="panel sidebar"><div class="panel-head"><h2>EXAM TOPICS</h2><span class="cap">6 BLOCKS</span></div><div class="nav-scroll">${BANK.map((b,t)=>{const arr=state.exam?.answers.filter(a=>QS[a.id].topic===t)||[];return `<div class="group-title">0${t+1} · ${esc(b.name.toUpperCase())}</div><div class="lesson-btn"><span class="number">${arr.length}/10</span><span>${esc(b.summary)}</span><span class="check">${arr.length?"●":""}</span></div>`;}).join("")}<div class="note"><b>EXAM RULES</b>Seis bloques. Una respuesta por pregunta. En el examen adaptativo las soluciones se muestran al finalizar.</div></div></aside>`;}
 let last=-1;return `<aside class="panel sidebar"><div class="panel-head"><h2>PYTHON PRACTICES</h2><span class="cap">${state.completed.length}/30 COMPLETE</span></div><div class="nav-scroll">${LESSONS.map((l,i)=>{let group=l.section!==last?`<div class="group-title">${String(l.section+1).padStart(2,"0")} · ${GROUPS[l.section]}</div>`:"";last=l.section;return group+`<button class="lesson-btn ${i===state.lesson?"active":""}" data-action="lesson" data-value="${i}"><span class="number">${String(l.id).padStart(2,"0")}</span><span>${esc(l.title)}</span><span class="check">${state.completed.includes(i)?"✓":""}</span></button>`;}).join("")}</div></aside>`;}
function svgBoard(compact=false){const board=state.board,cx=compact?250:355,top=compact?40:54,dx=compact?58:73,dy=compact?31:39;
 let svg=`<svg viewBox="0 0 ${compact?500:710} ${compact?245:340}" role="img" aria-label="Tablero de Hexapawn isométrico con tres filas y tres columnas"><defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#d8e5f8"/></linearGradient><linearGradient id="blackpawn"><stop stop-color="#294d8f"/><stop offset="1" stop-color="#0e254d"/></linearGradient><linearGradient id="whitepawn"><stop stop-color="#fff"/><stop offset="1" stop-color="#adc5ed"/></linearGradient></defs>`;
 svg+=`<text x="24" y="35" fill="var(--blue2)" font-size="12" font-weight="bold">PYTHON BOARD MODEL</text><text x="24" y="52" fill="var(--muted)" font-size="10">3 ROWS × 3 COLUMNS</text>`;
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=cx+(c-r)*dx,y=top+(c+r)*dy,rx=dx,ry=dy,chosen=state.selected&&state.selected[0]===r&&state.selected[1]===c;const points=`${x},${y} ${x+rx},${y+ry} ${x},${y+2*ry} ${x-rx},${y+ry}`;
 const canGo=!!state.selected&&moves(state.selected[0],state.selected[1]).some(([a,b])=>a===r&&b===c);
 svg+=`<g data-square="${r},${c}" style="cursor:pointer"><polygon points="${points}" fill="${chosen?"#e8bd65":canGo?"#f8da91":(r+c)%2?"#aec7e9":"url(#tile)"}" stroke="#4e79b3" stroke-width="2"/><text x="${x}" y="${y+ry+7}" text-anchor="middle" fill="#4772af" font-size="10">${"abc"[c]}${3-r}</text>`;
 if(board[r][c]!=="."){const p=board[r][c],px=x,py=y+ry-2,col=p==="B"?"url(#whitepawn)":"url(#blackpawn)",stroke=p==="B"?"#6385b9":"#142d57";svg+=`<ellipse cx="${px}" cy="${py+6}" rx="19" ry="8" fill="${col}" stroke="${stroke}" stroke-width="2"/><path d="M ${px-10} ${py+1} L ${px-7} ${py-26} Q ${px} ${py-35} ${px+7} ${py-26} L ${px+10} ${py+1} Z" fill="${col}" stroke="${stroke}" stroke-width="2"/><circle cx="${px}" cy="${py-30}" r="8" fill="${col}" stroke="${stroke}" stroke-width="2"/>`;}
 svg+="</g>";}
 svg+=`<g fill="var(--blue2)" font-size="11" font-weight="bold"><text x="${compact?17:42}" y="${compact?215:296}">B · WHITE</text><text x="${compact?340:540}" y="${compact?215:296}">N · BLACK</text></g></svg>`;return svg;}
function codePanel(){const a=lines(),current=state.step;return `<div class="codebox"><div class="code-head"><b class="cap">PYTHON · ${String(currentLesson().id).padStart(2,"0")}_PRACTICA.PY</b><button data-action="copy">COPY CODE</button></div><div class="code-lines">${a.map((line,i)=>`<div class="code-line ${i===current-1?"active":""}"><span class="ln">${String(i+1).padStart(2,"0")}</span><span>${esc(line)||" "}</span></div>`).join("")}</div></div>`;}
function learnCenter(){const l=currentLesson(),n=lines().length;return `<main class="panel center"><div class="panel-head"><h2>BOARD VISUALIZATION</h2><span class="pill">● LIVE MODEL</span></div><div class="diagram">${svgBoard()}</div><div class="legend"><span><i style="background:#3465aa"></i>NEGRA</span><span><i style="background:#c6d9f4;border:1px solid #678dbd"></i>BLANCA</span><span><i style="background:#edb55a"></i>CASILLA SELECCIONADA</span><span>Haz clic en un peón para explorar movimientos legales</span></div><div class="toolbar"><span class="play-label">STEP ${state.step}/${n}</span><button data-action="prev-step" ${state.step===0?"disabled":""}>←</button><button class="primary" data-action="play">${timer?"PAUSE":"▶ PLAY"}</button><button data-action="step" ${state.step===n?"disabled":""}>STEP →</button><button data-action="reset-step">↻ RESET</button><span class="spacer"></span><button data-action="reset-board">RESET BOARD</button></div>${codePanel()}</main>`;}
function learnInspector(){const l=currentLesson(),done=state.completed.includes(state.lesson);return `<aside class="panel inspector"><div class="panel-head"><h2>LESSON OVERVIEW</h2><span class="cap">${String(l.id).padStart(2,"0")} / 30</span></div><div class="panel-body"><span class="pill">${done?"✓ COMPLETED":"● ACTIVE"}</span><h2 style="margin:19px 0 9px">${esc(l.title.toUpperCase())}</h2><p>${esc(l.explanation)}</p><div class="kv"><span>SUBJECT</span><b>PYTHON BASICS</b></div><div class="kv"><span>BLOCK</span><b>${esc(GROUPS[l.section])}</b></div><div class="kv"><span>CODE LINES</span><b>${lines().length}</b></div><div class="kv"><span>GUIDED STEP</span><b>${state.step}/${lines().length}</b></div><div class="note"><b>YOUR CHALLENGE</b>${esc(l.challenge)}</div><h3 style="margin:20px 0 7px">EXPECTED OUTPUT</h3><pre class="output">${state.step>=lines().length?esc(l.output):"Avanza por el código para revelar el resultado."}</pre><p class="small">El recorrido destaca instrucciones; no ejecuta Python arbitrario. Para modificar y probar el programa, cópialo en Thonny y pulsa F5.</p><div class="buttons"><button class="primary" data-action="complete">${done?"✓ COMPLETED":"MARK COMPLETE"}</button><button data-action="next-lesson">NEXT LESSON →</button></div><p style="margin-top:17px" class="small"><a href="${LINK}" target="_blank" rel="noopener">ENTRADA ORIGINAL DEL BLOG ↗</a></p></div></aside>`;}
function learnTrace(){const a=lines();return `<section class="panel trace"><div class="panel-head"><h2>GUIDED TRACE</h2><span class="cap">LINE-BY-LINE · NO PYTHON INTERPRETER</span></div><div style="overflow:auto"><table><thead><tr><th>NO.</th><th>STATE</th><th>INSTRUCTION</th><th>EXPLANATION</th></tr></thead><tbody>${a.map((line,i)=>`<tr class="${i===state.step-1?"current":""}"><td>${String(i+1).padStart(2,"0")}</td><td>${i<state.step?"● VISITED":"○ PENDING"}</td><td>${esc(line.trim()||"(blank line)")}</td><td>${i===state.step-1?esc(currentLesson().explanation):""}</td></tr>`).join("")}</tbody></table></div></section>`;}
function topicStats(t){const a=state.exam?.answers.filter(x=>QS[x.id].topic===t)||[];return {n:a.length,correct:a.filter(x=>x.ok).length,accuracy:a.length?a.filter(x=>x.ok).length/a.length:0};}
function shouldEnd(){const ex=state.exam,n=ex.answers.length;if(ex.mode==="practice")return n===60;if(n<30)return false;if(n>=45)return true;if(n%6!==0)return false;return BANK.every((_,t)=>topicStats(t).n>=5&&topicStats(t).accuracy>=.6);}
function pickQ(){const ex=state.exam;if(ex.current)return QS[ex.current.id];const used=new Set(ex.answers.map(a=>a.id));let available=QS.filter(q=>!used.has(q.id));if(!available.length)return null;if(ex.mode==="practice")available.sort((a,b)=>a.id-b.id);else{const ranks=BANK.map((_,t)=>({topic:t,...topicStats(t)})).filter(t=>available.some(q=>q.topic===t.topic));ranks.sort((a,b)=>ex.answers.length<30?a.n-b.n||a.topic-b.topic:a.accuracy-b.accuracy||a.n-b.n);available=available.filter(q=>q.topic===ranks[0].topic).sort((a,b)=>Math.abs(a.difficulty-ex.level)-Math.abs(b.difficulty-ex.level));}const q=available[0];ex.current={id:q.id,order:shuffle([0,1,2,3])};save();return q;}
function examStartPanel(){return `<main class="panel center"><div class="panel-head"><h2>EXAM CONTROL</h2><span class="cap">READY TO START</span></div><div class="question"><span class="pill">60 QUESTIONS · 6 BLOCKS</span><h1>¿QUÉ SABES DE HEXAPAWN Y PYTHON?</h1><p>La evaluación utiliza el mismo banco de preguntas del cuestionario anterior. Practica con explicaciones inmediatas o realiza un examen adaptativo.</p><form id="exam-start"><div class="form-row"><label for="student">STUDENT NAME</label><input id="student" name="name" required maxlength="90" placeholder="Nombre o alias"></div><div class="form-row"><label for="group">GROUP</label><input id="group" name="group" maxlength="60" placeholder="2.º Bachillerato A"></div><div class="form-row"><label for="exam-mode">MODE</label><select id="exam-mode" name="mode"><option value="practice">PRÁCTICA · 60 preguntas con feedback</option><option value="exam">EXAMEN ADAPTATIVO · 30 a 45 preguntas</option></select></div><button type="submit" class="primary">START ASSESSMENT →</button></form></div></main>`;}
function examQuestionPanel(){const ex=state.exam,q=pickQ(),n=ex.answers.length;if(!q)return examResultsPanel();const ord=ex.current.order;return `<main class="panel center"><div class="panel-head"><h2>QUESTION ${n+1}</h2><span class="cap">${ex.mode==="practice"?"PRACTICE":"ADAPTIVE EXAM"} · LEVEL ${q.difficulty}/5</span></div><div class="question"><span class="pill">BLOCK ${q.topic+1} · ${esc(BANK[q.topic].name.toUpperCase())}</span><h1>${codeText(q.text)}</h1>${ex.feedback?`<div class="feedback ${ex.answers.at(-1).ok?"":"bad"}"><b>${ex.answers.at(-1).ok?"CORRECT":"REVIEW THE CONCEPT"}</b><p>${codeText(q.options[0])}</p><p>${esc(q.explanation)}</p></div><button class="primary" data-action="continue-exam">${ex.done?"VIEW RESULTS":"NEXT QUESTION"} →</button>`:`<div>${ord.map((idx,i)=>`<button class="option ${ex.choice===idx?"selected":""}" data-action="choose" data-value="${idx}"><span>${"ABCD"[i]}</span>${codeText(q.options[idx])}</button>`).join("")}</div><div class="buttons"><button class="primary" data-action="submit-answer" ${!Number.isInteger(ex.choice)?"disabled":""}>CONFIRM ANSWER →</button></div><p class="small">La respuesta no se podrá modificar. ${ex.mode==="exam"?"Las soluciones se mostrarán al finalizar.":""}</p>`}</div></main>`;}
function examReport(){const ex=state.exam,a=ex.answers,correct=a.filter(x=>x.ok).length,w=[1,1.35,1.7,2.15,2.65];let tot=0,earned=0;for(const x of a){const v=w[QS[x.id].difficulty-1];tot+=v;if(x.ok)earned+=v;}return {n:a.length,correct,score:tot?Math.round(100*earned/tot)/10:0,percentage:a.length?Math.round(100*correct/a.length):0,seconds:Math.round(((ex.ended||Date.now())-ex.started)/1000)};}
function examResultsPanel(){const ex=state.exam,r=examReport();return `<main class="panel center"><div class="panel-head"><h2>ASSESSMENT COMPLETE</h2><span class="pill">✓ FINISHED</span></div><div class="question"><span class="cap">${esc(ex.name)} · ${esc(ex.group||"TIC II")}</span><h1>YOUR RESULTS</h1><div class="result-num">${r.score.toFixed(1)}<small> / 10</small></div><p>Nota orientativa ponderada por dificultad.</p><div class="stats"><div><b>${r.correct}/${r.n}</b><span>CORRECT ANSWERS</span></div><div><b>${r.percentage}%</b><span>ACCURACY</span></div></div><h3>PERFORMANCE BY BLOCK</h3>${BANK.map((b,t)=>{const s=topicStats(t);return `<div class="kv"><span>${esc(b.name)}</span><b>${s.correct}/${s.n} · ${Math.round(100*s.accuracy)}%</b></div>`;}).join("")}<div class="buttons" style="margin-top:20px"><button class="primary" data-action="download-report">DOWNLOAD HTML REPORT</button><button data-action="download-json">JSON</button></div><h3 style="margin-top:20px">REVIEW ANSWERS</h3><div>${ex.answers.map(a=>{const q=QS[a.id];return `<details><summary>${a.ok?"✓":"✗"} ${esc(q.text)}</summary><p><b>Correct:</b> ${codeText(q.options[0])}</p><p>${esc(q.explanation)}</p></details>`;}).join("")}</div></div></main>`;}
function examCenter(){if(!state.exam)return examStartPanel();if(state.exam.done&&!state.exam.feedback)return examResultsPanel();return examQuestionPanel();}
function examInspector(){const ex=state.exam;return `<aside class="panel inspector"><div class="panel-head"><h2>EXAM OVERVIEW</h2><span class="cap">ASSESSMENT</span></div><div class="panel-body">${!ex?`<span class="pill">● READY</span><h2 style="margin-top:18px">ASSESSMENT SETTINGS</h2><p>Un mismo recorrido didáctico conecta la exploración del código con su evaluación.</p><div class="kv"><span>QUESTION BANK</span><b>60</b></div><div class="kv"><span>BLOCKS</span><b>6</b></div><div class="kv"><span>DIFFICULTY</span><b>1–5</b></div><div class="note"><b>TIP</b>Primero completa las lecciones del modo APRENDER. Después comprueba lo que has entendido.</div>`:ex.done&&!ex.feedback?`<span class="pill">✓ COMPLETE</span><h2 style="margin-top:17px">RESULTS SAVED LOCALLY</h2><p>${esc(ex.name)} · ${ex.answers.length} respuestas</p><div class="note">Puedes exportar tu informe HTML o JSON y entregarlo al profesor.</div><button data-action="new-exam" style="margin-top:15px">NEW ATTEMPT</button>`:`<span class="pill">● ${ex.mode==="practice"?"PRACTICE":"EXAM"}</span><h2 style="margin-top:17px">LIVE PROGRESS</h2><div class="result-num" style="font-size:42px">${ex.answers.length}<small> / ${ex.mode==="practice"?60:45}</small></div><div class="meter" style="height:10px"><i style="width:${Math.round(ex.answers.length/(ex.mode==="practice"?60:45)*100)}%"></i></div><div class="kv"><span>STUDENT</span><b>${esc(ex.name)}</b></div><div class="kv"><span>DIFFICULTY</span><b>${ex.level}/5</b></div><div class="kv"><span>ANSWERED</span><b>${ex.answers.length}</b></div><div class="note"><b>REMEMBER</b>Piensa en el estado del tablero y en los valores de las variables antes de elegir.</div>`}</div></aside>`;}
function examTrace(){const ex=state.exam;return `<section class="panel trace"><div class="panel-head"><h2>ASSESSMENT LOG</h2><span class="cap">LOCAL SESSION</span></div><div style="overflow:auto"><table><thead><tr><th>NO.</th><th>BLOCK</th><th>DIFFICULTY</th><th>STATUS</th></tr></thead><tbody>${ex?.answers.length?ex.answers.map((a,i)=>{const q=QS[a.id];return `<tr><td>${String(i+1).padStart(2,"0")}</td><td>${esc(BANK[q.topic].name)}</td><td>${q.difficulty}/5</td><td>${ex.mode==="exam"&&!ex.done?"RECORDED":a.ok?"✓ CORRECT":"✗ REVIEW"}</td></tr>`;}).join(""):'<tr><td colspan="4">Comienza un intento para registrar respuestas.</td></tr>'}</tbody></table></div></section>`;}
function render(){document.body.classList.toggle("dark",state.theme==="dark");mount.innerHTML=header()+`<div class="workspace">${sidebar()}${state.mode==="learn"?learnCenter()+learnInspector()+learnTrace():examCenter()+examInspector()+examTrace()}</div>`;}
function stepForward(){const n=lines().length;if(state.step>=n){stop();return;}state.step++;if(state.step===n&&(currentLesson().id===28||currentLesson().id===29)){const c=currentLesson().id===29?1:1;state.board[2][c]=".";state.board[1][c]="B";state.lastMove="b1-b2";}save();render();}
function startPlay(){if(timer){stop();render();return;}timer=setInterval(()=>{if(state.step>=lines().length){stop();render();return;}stepForward();},650);render();}
function valid(r,c){return r>=0&&r<3&&c>=0&&c<3;}
function moves(r,c){const p=state.board[r][c];if(p!==state.turn)return [];const rr=r+(p==="B"?-1:1);if(!valid(rr,c))return [];const m=[];if(state.board[rr][c]===".")m.push([rr,c]);for(const d of [-1,1]){const cc=c+d;if(valid(rr,cc)&&state.board[rr][cc]===(p==="B"?"N":"B"))m.push([rr,cc]);}return m;}
function squareClick(r,c){if(state.mode!=="learn")return;const choice=state.selected;if(choice&&moves(...choice).some(([a,b])=>a===r&&b===c)){const p=state.turn;state.board[choice[0]][choice[1]]=".";state.board[r][c]=p;state.turn=p==="B"?"N":"B";state.selected=null;state.lastMove=`${"abc"[choice[1]]}${3-choice[0]}-${"abc"[c]}${3-r}`;}else state.selected=state.board[r][c]===state.turn?[r,c]:null;save();render();}
function initExam(name,group,mode){state.exam={name,group,mode,answers:[],current:null,choice:null,level:2,streak:0,feedback:false,done:false,started:Date.now(),ended:null};save();render();}
function submitAnswer(){const ex=state.exam;if(!ex||!ex.current||!Number.isInteger(ex.choice))return;const q=QS[ex.current.id],ok=ex.choice===0;ex.answers.push({id:q.id,choice:ex.choice,ok,at:Date.now()});ex.streak=ok?Math.max(1,ex.streak+1):Math.min(-1,ex.streak-1);if(ex.streak>=2){ex.level=Math.min(5,ex.level+1);ex.streak=0;}if(ex.streak<=-2){ex.level=Math.max(1,ex.level-1);ex.streak=0;}ex.done=shouldEnd();if(ex.done)ex.ended=Date.now();ex.feedback=ex.mode==="practice";ex.choice=null;if(!ex.feedback)ex.current=null;save();render();}
function download(name,contents,type){const blob=new Blob([contents],{type:type+";charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function reportHTML(){const ex=state.exam,r=examReport();return `<!doctype html><html lang="es"><meta charset="utf-8"><title>SmartChess Explorer · Informe</title><style>body{font:15px/1.5 Arial;max-width:850px;margin:30px auto;padding:20px}article{border-top:1px solid #ccc;padding:12px}@media print{article{break-inside:avoid}}</style><h1>SMARTCHESS EXPLORER · TIC II</h1><p><b>Alumno:</b> ${esc(ex.name)}<br><b>Grupo:</b> ${esc(ex.group)}<br><b>Fecha:</b> ${new Date(ex.ended).toLocaleString("es-ES")}</p><h2>Nota orientativa: ${r.score.toFixed(1)}/10 · ${r.correct}/${r.n} aciertos</h2><h2>Respuestas</h2>${ex.answers.map(a=>{const q=QS[a.id];return `<article><b>${esc(q.text)}</b><p>Tu respuesta: ${esc(q.options[a.choice])} · ${a.ok?"Correcta":"Incorrecta"}</p><p>Solución: ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></article>`;}).join("")}</html>`;}
mount.addEventListener("click",e=>{const sq=e.target.closest("[data-square]");if(sq){const [r,c]=sq.dataset.square.split(",").map(Number);squareClick(r,c);return;}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==="switch-learn"){stop();state.mode="learn";save();render();}
 else if(a==="switch-exam"){stop();state.mode="exam";save();render();}
 else if(a==="theme"){state.theme=state.theme==="light"?"dark":"light";save();render();}
 else if(a==="lesson"){stop();state.lesson=Number(v);state.step=0;resetBoard();save();render();}
 else if(a==="step")stepForward();
 else if(a==="prev-step"){stop();state.step=Math.max(0,state.step-1);resetBoard();save();render();}
 else if(a==="reset-step"){stop();state.step=0;resetBoard();save();render();}
 else if(a==="play")startPlay();
 else if(a==="reset-board"){resetBoard();save();render();}
 else if(a==="next-lesson"){stop();state.lesson=(state.lesson+1)%30;state.step=0;resetBoard();save();render();}
 else if(a==="complete"){if(!state.completed.includes(state.lesson))state.completed.push(state.lesson);save();render();}
 else if(a==="copy"){const val=currentLesson().code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>{}).catch(()=>window.prompt("Copia el código:",val));else window.prompt("Copia el código:",val);}
 else if(a==="choose"){if(state.exam&&!state.exam.feedback){state.exam.choice=Number(v);save();render();}}
 else if(a==="submit-answer")submitAnswer();
 else if(a==="continue-exam"){state.exam.feedback=false;state.exam.current=null;save();render();}
 else if(a==="new-exam"){state.exam=null;save();render();}
 else if(a==="download-json")download("smartchess_explorer_resultado.json",JSON.stringify({exam:state.exam,report:examReport()},null,2),"application/json");
 else if(a==="download-report")download("smartchess_explorer_resultado.html",reportHTML(),"text/html");
});
