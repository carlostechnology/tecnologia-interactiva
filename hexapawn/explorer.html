function translateUI(){
 document.documentElement.lang=state.lang==="en"?"en":"es";
 if(state.lang!=="en")return;
 const root=document.getElementById("app");
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
   const p=node.parentElement;
   if(!p||p.closest("code,pre,textarea,script,style,svg,.code-lines,.py-editor,.py-console"))continue;
   const raw=node.textContent.trim();if(!raw)continue;
   let translated=EN_TRANSLATIONS[raw]||EN_TRANSLATIONS[raw.toLocaleLowerCase("es")?.replace(/^./,c=>c.toUpperCase())];
   if(!translated){
     const canonical=Object.keys(EN_TRANSLATIONS).find(k=>k.toUpperCase()===raw.toUpperCase());
     if(canonical)translated=raw===raw.toUpperCase()?EN_TRANSLATIONS[canonical].toUpperCase():EN_TRANSLATIONS[canonical];
   }
   if(!translated){
     let m=raw.match(/^(\d+)\/30 COMPLETE$/);if(m)translated=m[1]+"/30 COMPLETED";
   }
   if(!translated){
     const group=raw.match(/^(\d{2}) · (.+)$/);
     if(group&&EN_TRANSLATIONS[group[2]])translated=group[1]+" · "+EN_TRANSLATIONS[group[2]].toUpperCase();
   }
   if(translated)node.textContent=node.textContent.replace(raw,translated);
 }
}

function svgBoard(compact=false){
 const board=state.board;
 const proj=(r,c)=>{const w=126+r*25;return [355+(c-1.5)*w,118+r*76];};
 const pawn=(p,x,y,s)=>{
   const black=p==="N",body=black?"url(#smart-black-body)":"url(#smart-white-body)",edge=black?"#20252b":"#a6a7a0",cap="url(#smart-cap)",stripe=black?"#51565b":"#555a5c";
   return `<g transform="translate(${x} ${y}) scale(${s})" style="pointer-events:none" aria-hidden="true">
   <ellipse cx="0" cy="2" rx="38" ry="10" fill="#000" opacity=".17"/>
   <path d="M-34 -10 Q-34 -21 -21 -34 Q-13 -43 -12 -58 Q-8 -68 -12 -72 Q-20 -81 -11 -89 Q0 -96 11 -89 Q20 -81 12 -72 Q8 -68 12 -58 Q13 -43 21 -34 Q34 -21 34 -10 Q34 4 0 5 Q-34 4 -34 -10Z" fill="${body}" stroke="${edge}" stroke-width="2.2"/>
   <ellipse cx="0" cy="-10" rx="34" ry="9" fill="${body}" stroke="${edge}" stroke-width="1.8"/>
   <path d="M-28 -17 Q-20 -25 -14 -33 M14 -33 Q20 -25 28 -17" fill="none" stroke="${black?"#62676c":"#ffffff"}" opacity=".45" stroke-width="2"/>
   <ellipse cx="0" cy="-81" rx="14" ry="11" fill="${body}" stroke="${edge}" stroke-width="1.4"/>
   <path d="M-35 -89 C-41 -104 -28 -120 -8 -123 C15 -127 36 -115 37 -99 Q31 -90 19 -94 Q8 -89 0 -94 Q-14 -88 -21 -94 Q-32 -91 -35 -89Z" fill="${cap}" stroke="#303538" stroke-width="2.8"/>
   <path d="M-26 -100 Q-24 -116 -15 -119 M-13 -98 Q-11 -119 -4 -122 M1 -97 Q3 -119 10 -121 M16 -97 Q20 -113 23 -116 M29 -96 Q34 -105 30 -110" fill="none" stroke="${stripe}" stroke-width="3.2" opacity=".8" stroke-linecap="round"/>
   <path d="M-27 -107 Q-18 -119 -7 -120" fill="none" stroke="#96999a" stroke-width="2" opacity=".5"/>
   </g>`;
 };
 let svg=`<svg viewBox="0 0 710 450" role="img" aria-label="Tablero SmartChess realista de nueve casillas, con peones impresos en 3D de cabeza estriada. Haz clic en una pieza para moverla.">
 <defs>
 <linearGradient id="smart-wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3c399"/><stop offset=".52" stop-color="#c6a57a"/><stop offset="1" stop-color="#ebcca5"/></linearGradient>
 <linearGradient id="smart-black-tile" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#353738"/><stop offset=".5" stop-color="#191b1e"/><stop offset="1" stop-color="#3e3e3d"/></linearGradient>
 <linearGradient id="smart-black-body" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#17191c"/><stop offset=".45" stop-color="#393d42"/><stop offset="1" stop-color="#121519"/></linearGradient>
 <linearGradient id="smart-white-body" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#d6d4c6"/><stop offset=".4" stop-color="#fffdf0"/><stop offset="1" stop-color="#bdbdb1"/></linearGradient>
 <linearGradient id="smart-cap" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#56595a"/><stop offset=".4" stop-color="#24272a"/><stop offset="1" stop-color="#111416"/></linearGradient>
 <filter id="smart-board-shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#131d2c" flood-opacity=".23"/></filter>
 </defs>
 <text x="26" y="31" fill="var(--blue2)" font-size="12" font-weight="800" letter-spacing="1.2">SMARTCHESS · REAL BOARD</text>
 <text x="26" y="49" fill="var(--muted)" font-size="10">3 × 3 · ÍNDICES DE LISTAS [FILA][COLUMNA]</text>
 <g filter="url(#smart-board-shadow)">`;
 const corners=[proj(0,0),proj(0,3),proj(3,3),proj(3,0)];
 svg+=`<polygon points="${corners.map(pt=>pt.join(",")).join(" ")}" fill="#36312c" stroke="#41362a" stroke-width="7" stroke-linejoin="round"/>`;
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){
   const pts=[proj(r,c),proj(r,c+1),proj(r+1,c+1),proj(r+1,c)];
   const selected=state.selected&&state.selected[0]===r&&state.selected[1]===c;
   const canGo=!!state.selected&&moves(state.selected[0],state.selected[1]).some(([a,b])=>a===r&&b===c);
   const fill=(r+c)%2?"url(#smart-wood)":"url(#smart-black-tile)";
   svg+=`<g data-square="${r},${c}" style="cursor:pointer" tabindex="0" role="button" aria-label="Casilla ${"abc"[c]}${3-r}, ${board[r][c]==="."?"vacía":board[r][c]==="B"?"peón blanco":"peón negro"}">
    <polygon points="${pts.map(pt=>pt.join(",")).join(" ")}" fill="${fill}" stroke="#71675b" stroke-width="1.4"/>
    ${selected?`<polygon points="${pts.map(pt=>pt.join(",")).join(" ")}" fill="#eebc52" opacity=".55" stroke="#ffc64f" stroke-width="4"/>`:""}
    ${canGo?`<polygon points="${pts.map(pt=>pt.join(",")).join(" ")}" fill="#53d1a1" opacity=".42" stroke="#168a6d" stroke-width="3"/>`:""}
    <g style="pointer-events:none"><rect x="${pts[0][0]+8}" y="${pts[0][1]+9}" width="35" height="21" rx="4" fill="${(r+c)%2?"#fff5df":"#f1e1b8"}" opacity=".94"/><text x="${pts[0][0]+25}" y="${pts[0][1]+24}" text-anchor="middle" font-size="13" font-weight="900" fill="#b74127" font-family="ui-monospace,monospace">${r}${c}</text></g>
    </g>`;
 }
 svg+="</g>";
 // Python list indices and traditional chess coordinates reference the same squares.
 for(let c=0;c<3;c++){
   const a=proj(0,c),b=proj(0,c+1),d=proj(3,c),e=proj(3,c+1);
   const topX=(a[0]+b[0])/2,bottomX=(d[0]+e[0])/2;
   svg+=`<text x="${topX}" y="65" text-anchor="middle" fill="#bc4833" font-size="16" font-weight="900" font-family="ui-monospace,monospace">${c}</text>`;
   svg+=`<text x="${bottomX}" y="389" text-anchor="middle" fill="var(--blue2)" font-size="17" font-weight="900">${"abc"[c]}</text>`;
   svg+=`<text x="${bottomX+18}" y="408" text-anchor="middle" fill="#bc4833" font-size="12" font-weight="800" font-family="ui-monospace,monospace">${c}</text>`;
 }
 for(let r=0;r<3;r++){
   const a=proj(r,0),b=proj(r+1,0),y=(a[1]+b[1])/2+5,x=(a[0]+b[0])/2;
   svg+=`<text x="${x-24}" y="${y}" text-anchor="middle" fill="var(--blue2)" font-size="17" font-weight="900">${3-r}</text>`;
   svg+=`<text x="${x-49}" y="${y}" text-anchor="middle" fill="#bc4833" font-size="16" font-weight="900" font-family="ui-monospace,monospace">${r}</text>`;
 }
 for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(board[r][c]!=="."){
   const a=proj(r,c),b=proj(r,c+1),d=proj(r+1,c),e=proj(r+1,c+1);
   const x=(a[0]+b[0]+d[0]+e[0])/4,y=(a[1]+b[1]+d[1]+e[1])/4+26;
   svg+=pawn(board[r][c],x,y,r===0?.72:r===1?.84:.97);
 }
 svg+=`<g fill="var(--muted)" font-size="11" font-weight="700"><text x="37" y="424">● B · BLANCAS</text><text x="535" y="424">● N · NEGRAS</text></g></svg>`;
 return svg;
}

function topicStats(t){const a=state.exam?.answers.filter(x=>QS[x.id].topic===t)||[];return {n:a.length,correct:a.filter(x=>x.ok).length,accuracy:a.length?a.filter(x=>x.ok).length/a.length:0};}
function shouldEnd(){const ex=state.exam,n=ex.answers.length;if(ex.mode==="practice")return n===60;if(n<30)return false;if(n>=45)return true;if(n%6!==0)return false;return BANK.every((_,t)=>topicStats(t).n>=5&&topicStats(t).accuracy>=.6);}
function pickQ(){const ex=state.exam;if(ex.current)return QS[ex.current.id];const used=new Set(ex.answers.map(a=>a.id));let available=QS.filter(q=>!used.has(q.id));if(!available.length)return null;if(ex.mode==="practice")available.sort((a,b)=>a.id-b.id);else{const ranks=BANK.map((_,t)=>({topic:t,...topicStats(t)})).filter(t=>available.some(q=>q.topic===t.topic));ranks.sort((a,b)=>ex.answers.length<30?a.n-b.n||a.topic-b.topic:a.accuracy-b.accuracy||a.n-b.n);available=available.filter(q=>q.topic===ranks[0].topic).sort((a,b)=>Math.abs(a.difficulty-ex.level)-Math.abs(b.difficulty-ex.level));}const q=available[0];ex.current={id:q.id,order:shuffle([0,1,2,3])};save();return q;}
const ui=(es,en)=>state.lang==="en"?en:es;

function examQuestionPanel(){const ex=state.exam,originalQ=pickQ(),n=ex.answers.length;if(!originalQ)return examResultsPanel();const q=localizedQuestion(originalQ),ord=ex.current.order;return `<main class="panel center"><div class="panel-head"><h2>QUESTION ${n+1}</h2><span class="cap">${ex.mode==="practice"?"PRACTICE":"ADAPTIVE EXAM"} · LEVEL ${q.difficulty}/5</span></div><div class="question"><span class="pill">BLOCK ${q.topic+1} · ${esc(localizedTopic(q.topic).toUpperCase())}</span><h1>${codeText(q.text)}</h1>${ex.feedback?`<div class="feedback ${ex.answers.at(-1).ok?"":"bad"}"><b>${ex.answers.at(-1).ok?"CORRECT":"REVIEW THE CONCEPT"}</b><p>${codeText(q.options[0])}</p><p>${esc(q.explanation)}</p></div><button class="primary" data-action="continue-exam">${ex.done?"VIEW RESULTS":"NEXT QUESTION"} →</button>`:`<div>${ord.map((idx,i)=>`<button class="option ${ex.choice===idx?"selected":""}" data-action="choose" data-value="${idx}"><span>${"ABCD"[i]}</span>${codeText(q.options[idx])}</button>`).join("")}</div><div class="buttons"><button class="primary" data-action="submit-answer" ${!Number.isInteger(ex.choice)?"disabled":""}>CONFIRM ANSWER →</button></div><p class="small">${ui("La respuesta no se podrá modificar.","You cannot change your answer after submitting.")} ${ex.mode==="exam"?ui("Las soluciones se mostrarán al finalizar.","Correct answers will be shown at the end."):""}</p>`}</div></main>`;}
function examReport(){const ex=state.exam,a=ex.answers,correct=a.filter(x=>x.ok).length,w=[1,1.35,1.7,2.15,2.65];let tot=0,earned=0;for(const x of a){const v=w[QS[x.id].difficulty-1];tot+=v;if(x.ok)earned+=v;}return {n:a.length,correct,score:tot?Math.round(100*earned/tot)/10:0,percentage:a.length?Math.round(100*correct/a.length):0,seconds:Math.round(((ex.ended||Date.now())-ex.started)/1000)};}
function examResultsPanel(){const ex=state.exam,r=examReport();return `<main class="panel center"><div class="panel-head"><h2>ASSESSMENT COMPLETE</h2><span class="pill">✓ FINISHED</span></div><div class="question"><span class="cap">${esc(ex.name)} · ${esc(ex.group||"TIC II")}</span><h1>YOUR RESULTS</h1><div class="result-num">${r.score.toFixed(1)}<small> / 10</small></div><p>${ui("Nota orientativa ponderada por dificultad.","Estimated grade weighted by difficulty.")}</p><div class="stats"><div><b>${r.correct}/${r.n}</b><span>CORRECT ANSWERS</span></div><div><b>${r.percentage}%</b><span>ACCURACY</span></div></div><h3>PERFORMANCE BY BLOCK</h3>${BANK.map((b,t)=>{const s=topicStats(t);return `<div class="kv"><span>${esc(localizedTopic(t))}</span><b>${s.correct}/${s.n} · ${Math.round(100*s.accuracy)}%</b></div>`;}).join("")}<div class="buttons" style="margin-top:20px"><button class="primary" data-action="download-report">DOWNLOAD HTML REPORT</button><button data-action="download-json">JSON</button></div><h3 style="margin-top:20px">REVIEW ANSWERS</h3><div>${ex.answers.map(a=>{const q=localizedQuestion(QS[a.id]);return `<details><summary>${a.ok?"✓":"✗"} ${esc(q.text)}</summary><p><b>Correct:</b> ${codeText(q.options[0])}</p><p>${esc(q.explanation)}</p></details>`;}).join("")}</div></div></main>`;}
function examCenter(){if(!state.exam)return examStartPanel();if(state.exam.done&&!state.exam.feedback)return examResultsPanel();return examQuestionPanel();}
function examInspector(){const ex=state.exam;return `<aside class="panel inspector"><div class="panel-head"><h2>EXAM OVERVIEW</h2><span class="cap">ASSESSMENT</span></div><div class="panel-body">${!ex?`<span class="pill">● READY</span><h2 style="margin-top:18px">ASSESSMENT SETTINGS</h2><p>${ui("Un mismo recorrido didáctico conecta la exploración del código con su evaluación.","The same learning pathway connects coding practice with assessment.")}</p><div class="kv"><span>QUESTION BANK</span><b>60</b></div><div class="kv"><span>BLOCKS</span><b>6</b></div><div class="kv"><span>DIFFICULTY</span><b>1–5</b></div><div class="note"><b>TIP</b>${ui("Primero completa las lecciones del modo APRENDER. Después comprueba lo que has entendido.","Complete the LEARN lessons first, then test your understanding.")}</div>`:ex.done&&!ex.feedback?`<span class="pill">✓ COMPLETE</span><h2 style="margin-top:17px">RESULTS SAVED LOCALLY</h2><p>${esc(ex.name)} · ${ex.answers.length} respuestas</p><div class="note">${ui("Puedes exportar tu informe HTML o JSON y entregarlo al profesor.","Export your HTML or JSON report and share it with your teacher.")}</div><button data-action="new-exam" style="margin-top:15px">NEW ATTEMPT</button>`:`<span class="pill">● ${ex.mode==="practice"?"PRACTICE":"EXAM"}</span><h2 style="margin-top:17px">LIVE PROGRESS</h2><div class="result-num" style="font-size:42px">${ex.answers.length}<small> / ${ex.mode==="practice"?60:45}</small></div><div class="meter" style="height:10px"><i style="width:${Math.round(ex.answers.length/(ex.mode==="practice"?60:45)*100)}%"></i></div><div class="kv"><span>STUDENT</span><b>${esc(ex.name)}</b></div><div class="kv"><span>DIFFICULTY</span><b>${ex.level}/5</b></div><div class="kv"><span>ANSWERED</span><b>${ex.answers.length}</b></div><div class="note"><b>REMEMBER</b>${ui("Piensa en el estado del tablero y en los valores de las variables antes de elegir.","Think about the board and variable values before you choose.")}</div>`}</div></aside>`;}
function examTrace(){const ex=state.exam;return `<section class="panel trace"><div class="panel-head"><h2>ASSESSMENT LOG</h2><span class="cap">LOCAL SESSION</span></div><div style="overflow:auto"><table><thead><tr><th>NO.</th><th>BLOCK</th><th>DIFFICULTY</th><th>STATUS</th></tr></thead><tbody>${ex?.answers.length?ex.answers.map((a,i)=>{const q=QS[a.id];return `<tr><td>${String(i+1).padStart(2,"0")}</td><td>${esc(localizedTopic(q.topic))}</td><td>${q.difficulty}/5</td><td>${ex.mode==="exam"&&!ex.done?"RECORDED":a.ok?"✓ CORRECT":"✗ REVIEW"}</td></tr>`;}).join(""):'<tr><td colspan="4">${ui("Comienza un intento para registrar respuestas.","Start an attempt to record answers.")}</td></tr>'}</tbody></table></div></section>`;}
function render(){document.body.classList.toggle("dark",state.theme==="dark");mount.innerHTML=header()+`<div class="workspace">${sidebar()}${state.mode==="learn"?learnCenter()+learnTrace():examCenter()+examInspector()+examTrace()}</div>`;translateUI();}
function applyPythonBoard(nextBoard){
 if(!Array.isArray(nextBoard)||nextBoard.length!==3||!nextBoard.every(row=>Array.isArray(row)&&row.length===3&&row.every(cell=>cell==="B"||cell==="N"||cell===".")))return false;
 state.board=nextBoard.map(row=>row.slice());
 state.turn="B";state.selected=null;state.lastMove="Actualizado desde RUN PYTHON";
 save();
 const diagram=mount.querySelector(".board-column .diagram");
 if(diagram)diagram.innerHTML=svgBoard();
 return true;
}
window.smartChessUpdateFromPython=applyPythonBoard;
window.smartChessUpdatePawnCount=function(n){
 if(state.mode!=="learn"||currentLesson().id!==1||!Number.isInteger(n)||n<0||n>9)return false;
 state.board=countBoard(n);state.turn="B";state.selected=null;state.lastMove="peones = "+n;
 save();const diagram=mount.querySelector(".board-column .diagram");if(diagram)diagram.innerHTML=svgBoard();
 return true;
};
window.smartChessUpdateRowFromPython=function(nextRow){
 if(!Array.isArray(nextRow)||nextRow.length!==3||!nextRow.every(cell=>cell==="B"||cell==="N"||cell==="."))return false;
 // In the introductory list exercises, "fila" represents tablero[0].
 state.board[0]=nextRow.slice();
 state.turn="B";state.selected=null;state.lastMove="Primera fila actualizada desde Python";
 save();
 const diagram=mount.querySelector(".board-column .diagram");
 if(diagram)diagram.innerHTML=svgBoard();
 return true;
};

function stepForward(){const n=lines().length;if(state.step>=n){stop();return;}state.step++;if(state.step===n&&(currentLesson().id===28||currentLesson().id===29)){const c=currentLesson().id===29?1:1;state.board[2][c]=".";state.board[1][c]="B";state.lastMove="b1-b2";}save();render();}
function startPlay(){if(timer){stop();render();return;}timer=setInterval(()=>{if(state.step>=lines().length){stop();render();return;}stepForward();},650);render();}
function valid(r,c){return r>=0&&r<3&&c>=0&&c<3;}
function moves(r,c){const p=state.board[r][c];if(p!==state.turn)return [];const rr=r+(p==="B"?-1:1);if(!valid(rr,c))return [];const m=[];if(state.board[rr][c]===".")m.push([rr,c]);for(const d of [-1,1]){const cc=c+d;if(valid(rr,cc)&&state.board[rr][cc]===(p==="B"?"N":"B"))m.push([rr,cc]);}return m;}
function squareClick(r,c){if(state.mode!=="learn")return;const choice=state.selected;if(choice&&moves(...choice).some(([a,b])=>a===r&&b===c)){const p=state.turn;state.board[choice[0]][choice[1]]=".";state.board[r][c]=p;state.turn=p==="B"?"N":"B";state.selected=null;state.lastMove=`${"abc"[choice[1]]}${3-choice[0]}-${"abc"[c]}${3-r}`;}else state.selected=state.board[r][c]===state.turn?[r,c]:null;save();render();}
function initExam(name,group,mode){state.exam={name,group,mode,answers:[],current:null,choice:null,level:2,streak:0,feedback:false,done:false,started:Date.now(),ended:null};save();render();}
function submitAnswer(){const ex=state.exam;if(!ex||!ex.current||!Number.isInteger(ex.choice))return;const q=QS[ex.current.id],ok=ex.choice===0;ex.answers.push({id:q.id,choice:ex.choice,ok,at:Date.now()});ex.streak=ok?Math.max(1,ex.streak+1):Math.min(-1,ex.streak-1);if(ex.streak>=2){ex.level=Math.min(5,ex.level+1);ex.streak=0;}if(ex.streak<=-2){ex.level=Math.max(1,ex.level-1);ex.streak=0;}ex.done=shouldEnd();if(ex.done)ex.ended=Date.now();ex.feedback=ex.mode==="practice";ex.choice=null;if(!ex.feedback)ex.current=null;save();render();}
function download(name,contents,type){const blob=new Blob([contents],{type:type+";charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function reportHTML(){const ex=state.exam,r=examReport();return `<!doctype html><html lang="es"><meta charset="utf-8"><title>SmartChess Explorer · Informe</title><style>body{font:15px/1.5 Arial;max-width:850px;margin:30px auto;padding:20px}article{border-top:1px solid #ccc;padding:12px}@media print{article{break-inside:avoid}}</style><h1>SMARTCHESS EXPLORER · TIC II</h1><p><b>Alumno:</b> ${esc(ex.name)}<br><b>Grupo:</b> ${esc(ex.group)}<br><b>Fecha:</b> ${new Date(ex.ended).toLocaleString("es-ES")}</p><h2>Nota orientativa: ${r.score.toFixed(1)}/10 · ${r.correct}/${r.n} aciertos</h2><h2>Respuestas</h2>${ex.answers.map(a=>{const q=QS[a.id];return `<article><b>${esc(q.text)}</b><p>Tu respuesta: ${esc(q.options[a.choice])} · ${a.ok?"Correcta":"Incorrecta"}</p><p>Solución: ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></article>`;}).join("")}</html>`;}

 if(e.target.matches('input[name^="quiz-"]')){
  const id=Number(e.target.name.slice(5));
  if(!Number.isInteger(id)||id<1||id>30)return;

 }
});
mount.addEventListener("click",e=>{const sq=e.target.closest("[data-square]");if(sq){const [r,c]=sq.dataset.square.split(",").map(Number);squareClick(r,c);return;}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==="check-quiz"){const l=currentLesson(),current=quizAnswer(l.id);if(current.selected!==null){current.tried=true;current.passed=current.selected===0;state.quizAnswers[l.id]=current;delete taskChecks[l.id];save();render();}}
 else if(a==="verify-lesson"){taskChecks[currentLesson().id]=checkCurrentLesson();render();}

 else if(a==="step")stepForward();
 else if(a==="prev-step"){stop();state.step=Math.max(0,state.step-1);resetBoard();save();render();}

 else if(a==="play")startPlay();
 else if(a==="reset-board"){resetBoard();save();render();}
 else if(a==="next-lesson"){stop();state.lesson=(state.lesson+1)%30;state.step=0;resetBoard();save();render();}
 else if(a==="complete"){if(taskChecks[currentLesson().id]?.ok||state.completed.includes(state.lesson)){if(!state.completed.includes(state.lesson))state.completed.push(state.lesson);save();render();}}
 else if(a==="copy"){const val=currentLesson().code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>{}).catch(()=>window.prompt("Copia el código:",val));else window.prompt("Copia el código:",val);}
 else if(a==="choose"){if(state.exam&&!state.exam.feedback){state.exam.choice=Number(v);save();render();}}
 else if(a==="submit-answer")submitAnswer();
 else if(a==="continue-exam"){state.exam.feedback=false;state.exam.current=null;save();render();}
 else if(a==="new-exam"){state.exam=null;save();render();}
 else if(a==="download-json")download("smartchess_explorer_resultado.json",JSON.stringify({exam:state.exam,report:examReport()},null,2),"application/json");
 else if(a==="download-report")download("smartchess_explorer_resultado.html",reportHTML(),"text/html");
});

      const synced=typeof window.smartChessUpdatePawnCount==="function"&&window.smartChessUpdatePawnCount(pawnCount);
      const message=document.createElement("span");message.className="py-board-caption";
      message.textContent=synced?`✓ peones = ${pawnCount}: el tablero muestra ${pawnCount} pieza${pawnCount===1?"":"s"}.`:"El valor de peones debe ser un número entero de 0 a 9 para representarlo en el tablero.";
      target.replaceChildren(message);target.classList.add("visible");return;
    }
    const isBoard=!!board;
    const update=isBoard?window.smartChessUpdateFromPython:window.smartChessUpdateRowFromPython;
    const synced=typeof update==="function"&&update(isBoard?board:row);
    const message=document.createElement("span");
    message.className="py-board-caption";
    message.textContent=synced
      ?(isBoard?"✓ tablero (matriz 3×3): se han actualizado las nueve casillas de la izquierda.":"✓ fila (lista de tres elementos): se ha actualizado la primera fila, tablero[0].")
      :"Python ha generado la lista, pero no se ha podido actualizar la representación.";
    target.replaceChildren(message);target.classList.add("visible");
  }
  function stop(message) {
    if (worker) { worker.terminate(); worker=null; }
    if (watchdog) { clearTimeout(watchdog); watchdog=null; }
    activeId++; busy=false;
    status("STOPPED"); if (message) consoleText(message);
    controls();
  }
  function start() {
    const panel=getPanel(); if (!panel || busy) return;
    const code=panel.querySelector(".py-editor").value;
    const lessonId=window.smartChessCurrentLessonId?.();
    if (!code.trim()) { consoleText("Escribe algunas instrucciones de Python primero."); return; }
    busy=true; controls(); status("STARTING…"); consoleText("Cargando Python…"); boardPreview(null);
    const id=++activeId;
    runs.set(id,{lessonId,code});
    try {
      if (!worker) {
        worker = new Worker("python-worker.js?v=20261103-peones-sync",{type:"module"});
        worker.addEventListener("message", event => {
          const msg=event.data || {};
          if (msg.type==="loading") { status("LOADING PYTHON…"); return; }
          if (msg.type==="ready") { status("PYTHON READY"); return; }
          if (msg.id !== activeId) return;
          const run=runs.get(msg.id)||{};runs.delete(msg.id);
          if (watchdog) {clearTimeout(watchdog);watchdog=null;}
          busy=false; controls();
          if (msg.type==="result") {
            status("✓ FINISHED");
            const output=[msg.output,msg.stderr].filter(Boolean).join("\n");
            consoleText(output || "✓ Programa terminado. No se ha utilizado print().");
            boardPreview(msg.board,msg.row,msg.pawnCount);
            window.dispatchEvent(new CustomEvent("smartchess:python-result",{detail:{lessonId:run.lessonId,code:run.code,output:msg.output||"",error:msg.stderr||"",board:msg.board,row:msg.row}}));
          } else {
            status("ERROR");
            consoleText([msg.output,msg.stderr,msg.error].filter(Boolean).join("\n") || "Error al ejecutar el programa.");
            window.dispatchEvent(new CustomEvent("smartchess:python-result",{detail:{lessonId:run.lessonId,code:run.code,output:msg.output||"",error:msg.error||msg.stderr||""}}));
          }
        });
        worker.addEventListener("error", event => {
          if (watchdog) { clearTimeout(watchdog); watchdog=null; }
          busy=false; controls(); status("LOAD ERROR");
          consoleText("No se ha podido iniciar Python. Comprueba la conexión a Internet y vuelve a intentarlo.\n"+(event.message||""));
          worker.terminate(); worker=null;
        });
      }
      worker.postMessage({id,code});
      watchdog = setTimeout(() => {if (busy && activeId===id) stop("Ejecución detenida tras 45 segundos. Revisa si existe un bucle infinito y vuelve a probar.");},45000);
    } catch(error) {stop("No se pudo iniciar el intérprete: "+String(error));}
  }
  document.addEventListener("click",event => {
    const button=event.target.closest("[data-py-action]");
    if(!button || !getPanel()?.contains(button))return;
    const action=button.dataset.pyAction;
    if(action==="run")start();
    if(action==="stop")stop("■ Programa interrumpido. Puedes corregirlo y ejecutarlo de nuevo.");
    if(action==="reset"){
      const panel=getPanel(), key=panel.dataset.lesson;
      const code=originals.get(key)||"";
      drafts.delete(key);panel.querySelector(".py-editor").value=code;
      consoleText("Código original restaurado.");boardPreview(null);status("READY");
    }
  });
})();
</script>
</body></html>
